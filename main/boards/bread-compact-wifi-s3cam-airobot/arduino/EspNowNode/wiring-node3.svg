<?xml version="1.0" encoding="UTF-8"?>
<!-- 节点 3「融合节点」接线图：ESP32-S3 + RGB(4线共阳) + HC-SR04(宽电压 3.3V 供电) + DHT11 + 红外避障
     与 EspNowNode.ino（NODE_ID=3）的引脚定义一一对应。
     一台板接全部四个传感器；DHT11/红外避障因 GPIO4/5 已被 RGB 占用而改用 GPIO16/17。
     画法：线与线交叉处用白底"跳线"断开，表示不相连；模块引脚物理排列以实物丝印为准。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 930" width="1120" height="930"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <rect x="0" y="0" width="1120" height="930" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold" fill="#111827">节点 3「融合节点」接线：ESP32-S3 + RGB + 超声波 + DHT11 + 红外避障（一台板接全部四个）</text>

  <!-- ============ 连线：每条线先画白色粗底再画彩线，后画的线在交叉处形成跳线缺口 ============ -->

  <!-- 信号线（蓝） -->
  <g fill="none">
    <path d="M250 200 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 200 H700" stroke="#2563eb" stroke-width="3"/>
    <path d="M250 225 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 225 H700" stroke="#2563eb" stroke-width="3"/>
    <path d="M250 250 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 250 H700" stroke="#2563eb" stroke-width="3"/>
    <path d="M250 390 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 390 H700" stroke="#2563eb" stroke-width="3"/>
    <path d="M250 415 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 415 H700" stroke="#2563eb" stroke-width="3"/>
    <path d="M250 560 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 560 H700" stroke="#2563eb" stroke-width="3"/>
    <path d="M250 695 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 695 H700" stroke="#2563eb" stroke-width="3"/>
  </g>

  <!-- 地线（黑）：GND 干线 x=560，分支到超声波/DHT/红外避障的 GND -->
  <g fill="none">
    <path d="M250 175 H560 V720 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 175 H560 V720 H700" stroke="#111827" stroke-width="3"/>
    <path d="M560 440 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M560 440 H700" stroke="#111827" stroke-width="3"/>
    <path d="M560 585 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M560 585 H700" stroke="#111827" stroke-width="3"/>
  </g>

  <!-- 3V3（红）：干线 x=520，分支到 RGB(+) / 超声波 VCC / DHT VCC / 红外避障 VCC -->
  <g fill="none">
    <path d="M250 140 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 140 H700" stroke="#dc2626" stroke-width="3"/>
    <path d="M520 140 V665 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M520 140 V665 H700" stroke="#dc2626" stroke-width="3"/>
    <path d="M520 365 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M520 365 H700" stroke="#dc2626" stroke-width="3"/>
    <path d="M520 530 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M520 530 H700" stroke="#dc2626" stroke-width="3"/>
  </g>

  <!-- ============ 模块方框 ============ -->
  <!-- ESP32-S3 -->
  <rect x="40" y="90" width="210" height="655" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="145" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">ESP32-S3</text>
  <text x="145" y="146" text-anchor="middle" font-size="12" fill="#6b7280">（USB 5V 供电）</text>

  <!-- RGB -->
  <rect x="700" y="90" width="340" height="200" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="870" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#78350f">RGB 模块（4 线，共阳）</text>
  <text x="1030" y="138" text-anchor="end" font-size="12" fill="#92400e">丝印 + / R / G / B，无独立 GND 脚</text>
  <text x="870" y="277" text-anchor="middle" font-size="12" fill="#92400e">+ 是公共阳极：接 3V3，低电平点亮</text>

  <!-- 超声波 -->
  <rect x="700" y="305" width="340" height="160" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="870" y="328" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">HC-SR04（宽电压 3.3–5V）</text>
  <text x="1030" y="352" text-anchor="end" font-size="12" fill="#1e40af">3.3V 供电 → ECHO ≈ 3.3V</text>
  <text x="870" y="457" text-anchor="middle" font-size="12" fill="#1e40af">ECHO 直连 GPIO15，无需分压</text>

  <!-- DHT11 -->
  <rect x="700" y="480" width="340" height="120" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="870" y="502" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">DHT11（3 线，自带上拉）</text>
  <text x="1030" y="526" text-anchor="end" font-size="12" fill="#166534">DATA → GPIO16</text>
  <text x="870" y="594" text-anchor="middle" font-size="12" fill="#166534">GPIO4 已被 RGB 的 R 占用，故换脚</text>

  <!-- 红外避障模块 -->
  <rect x="700" y="615" width="340" height="120" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="870" y="637" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">红外避障模块（OUT 数字输出）</text>
  <text x="1030" y="661" text-anchor="end" font-size="12" fill="#991b1b">OUT → GPIO17（低电平 = 检测障碍）</text>
  <text x="870" y="729" text-anchor="middle" font-size="12" fill="#991b1b">GPIO5 已被 RGB 的 G 占用，故换脚</text>

  <!-- ============ 引脚名 + 连接点 ============ -->
  <g font-size="14" fill="#111827">
    <text x="232" y="145" text-anchor="end">3V3</text>
    <text x="232" y="180" text-anchor="end">GND</text>
    <text x="232" y="205" text-anchor="end">GPIO4</text>
    <text x="232" y="230" text-anchor="end">GPIO5</text>
    <text x="232" y="255" text-anchor="end">GPIO6</text>
    <text x="232" y="395" text-anchor="end">GPIO7</text>
    <text x="232" y="420" text-anchor="end">GPIO15</text>
    <text x="232" y="565" text-anchor="end">GPIO16</text>
    <text x="232" y="700" text-anchor="end">GPIO17</text>
  </g>
  <g font-size="14" fill="#111827">
    <text x="720" y="145">+（公共阳极）</text>
    <text x="720" y="205">R</text>
    <text x="720" y="230">G</text>
    <text x="720" y="255">B</text>
  </g>
  <g font-size="14" fill="#111827">
    <text x="720" y="370">VCC</text>
    <text x="720" y="395">TRIG</text>
    <text x="720" y="420">ECHO</text>
    <text x="720" y="445">GND</text>
  </g>
  <g font-size="14" fill="#111827">
    <text x="720" y="535">VCC</text>
    <text x="720" y="565">DATA</text>
    <text x="720" y="590">GND</text>
  </g>
  <g font-size="14" fill="#111827">
    <text x="720" y="670">VCC</text>
    <text x="720" y="700">OUT</text>
    <text x="720" y="725">GND</text>
  </g>

  <!-- 连接点（圆点） -->
  <g>
    <circle cx="250" cy="140" r="4" fill="#dc2626"/>
    <circle cx="250" cy="175" r="4" fill="#111827"/>
    <circle cx="250" cy="200" r="4" fill="#2563eb"/>
    <circle cx="250" cy="225" r="4" fill="#2563eb"/>
    <circle cx="250" cy="250" r="4" fill="#2563eb"/>
    <circle cx="250" cy="390" r="4" fill="#2563eb"/>
    <circle cx="250" cy="415" r="4" fill="#2563eb"/>
    <circle cx="250" cy="560" r="4" fill="#2563eb"/>
    <circle cx="250" cy="695" r="4" fill="#2563eb"/>
    <circle cx="700" cy="140" r="4" fill="#dc2626"/>
    <circle cx="700" cy="200" r="4" fill="#2563eb"/>
    <circle cx="700" cy="225" r="4" fill="#2563eb"/>
    <circle cx="700" cy="250" r="4" fill="#2563eb"/>
    <circle cx="700" cy="365" r="4" fill="#dc2626"/>
    <circle cx="700" cy="390" r="4" fill="#2563eb"/>
    <circle cx="700" cy="415" r="4" fill="#2563eb"/>
    <circle cx="700" cy="440" r="4" fill="#111827"/>
    <circle cx="700" cy="530" r="4" fill="#dc2626"/>
    <circle cx="700" cy="560" r="4" fill="#2563eb"/>
    <circle cx="700" cy="585" r="4" fill="#111827"/>
    <circle cx="700" cy="665" r="4" fill="#dc2626"/>
    <circle cx="700" cy="695" r="4" fill="#2563eb"/>
    <circle cx="700" cy="720" r="4" fill="#111827"/>
    <!-- 分支点（大点 = 电气相连） -->
    <circle cx="520" cy="140" r="5" fill="#dc2626"/>
    <circle cx="520" cy="365" r="5" fill="#dc2626"/>
    <circle cx="520" cy="530" r="5" fill="#dc2626"/>
    <circle cx="560" cy="175" r="5" fill="#111827"/>
    <circle cx="560" cy="440" r="5" fill="#111827"/>
    <circle cx="560" cy="585" r="5" fill="#111827"/>
  </g>

  <!-- ============ 图例与注意事项 ============ -->
  <g font-size="13" fill="#374151">
    <path d="M40 800 H92" stroke="#dc2626" stroke-width="3"/>
    <text x="100" y="805">3V3 电源</text>
    <path d="M200 800 H252" stroke="#111827" stroke-width="3"/>
    <text x="260" y="805">GND</text>
    <path d="M330 800 H382" stroke="#2563eb" stroke-width="3"/>
    <text x="390" y="805">信号线（GPIO → 模块）</text>
  </g>
  <g font-size="13" fill="#374151">
    <text x="40" y="838">① 这是"只有一块板"时的接法：一台 ESP32-S3 同时接全部四个传感器，三个演示场景可在一块板上全部演完</text>
    <text x="40" y="860">② DHT11 与红外避障改用 GPIO16/17（GPIO4/5 已被 RGB 占用）；从节点 2 搬线时必须把线挪过来，否则“温度读不出 + 灯色乱跳”；避障模块 OUT 低电平=检测到障碍</text>
    <text x="40" y="882">③ 超声波 3.3V 供电 → ECHO 直连 GPIO15（无需分压）；若改用 5V 供电，ECHO 必须先串 1kΩ 并对地 2kΩ 分压</text>
    <text x="40" y="904">④ RGB 为 4 线共阳：+ 接 3V3；共阴模块公共端改接 GND 并把 RGB_COMMON_ANODE 改成 0。引脚排列以丝印为准，线交叉处不连接</text>
  </g>
</svg>
