<?xml version="1.0" encoding="UTF-8"?>
<!-- 节点 4「厨房」接线图：ESP32-S3 + MQ-2 烟雾/可燃气 + 火焰传感器
     与 node4_kitchen.h（NODE_ID=4）的引脚定义一一对应。
     MQ-2 用 5V 供电，DO/AO 是 5V 域，必须 1kΩ 串 + 2kΩ 对地分压后再进 GPIO；
     火焰模块用 3.3V 供电，DO/AO 直连。
     画法：线与线交叉处用白底"跳线"断开，表示不相连；模块引脚物理排列以实物丝印为准。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <rect x="0" y="0" width="1120" height="760" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold" fill="#111827">节点 4「厨房」接线：ESP32-S3 + MQ-2 烟雾/可燃气 + 火焰传感器（只监测、只播报）</text>

  <!-- ============ 连线：每条线先画白色粗底再画彩线，后画的线在交叉处形成跳线缺口 ============ -->

  <!-- 电源线（红）：5V → MQ-2 VCC；3V3 → 火焰 VCC -->
  <g fill="none">
    <path d="M250 140 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 140 H700" stroke="#dc2626" stroke-width="3"/>
    <path d="M250 380 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 380 H700" stroke="#dc2626" stroke-width="3"/>
  </g>

  <!-- 地线（黑）：GND 干线 x=560，分支到两个模块的 GND -->
  <g fill="none">
    <path d="M250 245 H700 M560 245 V485 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 245 H700 M560 245 V485 H700" stroke="#111827" stroke-width="3"/>
  </g>

  <!-- 信号线（蓝）：MQ-2 DO/AO 与火焰 DO/AO -->
  <g fill="none">
    <path d="M250 175 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 175 H700" stroke="#2563eb" stroke-width="3"/>
    <path d="M250 210 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 210 H700" stroke="#2563eb" stroke-width="3"/>
    <path d="M250 415 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 415 H700" stroke="#2563eb" stroke-width="3"/>
    <path d="M250 450 H700" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 450 H700" stroke="#2563eb" stroke-width="3"/>
  </g>

  <!-- ============ 模块方框 ============ -->
  <!-- ESP32-S3 -->
  <rect x="40" y="90" width="210" height="470" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="145" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">ESP32-S3</text>
  <text x="145" y="146" text-anchor="middle" font-size="12" fill="#6b7280">（USB 5V 供电）</text>

  <!-- MQ-2 -->
  <rect x="700" y="90" width="340" height="210" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="870" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">MQ-2 烟雾/可燃气模块（4 针）</text>
  <text x="1030" y="138" text-anchor="end" font-size="12" fill="#991b1b">VCC 必须接 5V（加热丝按 5V 标定）</text>
  <text x="870" y="285" text-anchor="middle" font-size="12" fill="#991b1b">DO/AO 都是 5V 域：各串 1kΩ + 对地 2kΩ 分压（≈3.33V）</text>

  <!-- 火焰传感器 -->
  <rect x="700" y="330" width="340" height="190" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="870" y="354" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">火焰传感器（KY-026 类，4 针）</text>
  <text x="1030" y="378" text-anchor="end" font-size="12" fill="#9a3412">VCC 接 3V3：DO/AO 都不超压</text>
  <text x="870" y="508" text-anchor="middle" font-size="12" fill="#9a3412">直连 GPIO，不需要分压（省掉两个电阻）</text>

  <!-- ============ 引脚名 + 连接点 ============ -->
  <g font-size="14" fill="#111827">
    <text x="232" y="145" text-anchor="end">5V / VIN</text>
    <text x="232" y="180" text-anchor="end">GPIO4</text>
    <text x="232" y="215" text-anchor="end">GPIO1</text>
    <text x="232" y="250" text-anchor="end">GND</text>
    <text x="232" y="385" text-anchor="end">3V3</text>
    <text x="232" y="420" text-anchor="end">GPIO5</text>
    <text x="232" y="455" text-anchor="end">GPIO2</text>
    <text x="232" y="490" text-anchor="end">GND</text>
  </g>
  <g font-size="14" fill="#111827">
    <text x="720" y="145">VCC</text>
    <text x="720" y="180">DO（低电平=超阈值）</text>
    <text x="720" y="215">AO（浓度趋势）</text>
    <text x="720" y="250">GND</text>
  </g>
  <g font-size="14" fill="#111827">
    <text x="720" y="385">VCC</text>
    <text x="720" y="420">DO（低电平=检测到火焰）</text>
    <text x="720" y="455">AO（红外强度，可选）</text>
    <text x="720" y="490">GND</text>
  </g>

  <!-- 连接点（圆点） -->
  <g>
    <circle cx="250" cy="140" r="4" fill="#dc2626"/>
    <circle cx="250" cy="175" r="4" fill="#2563eb"/>
    <circle cx="250" cy="210" r="4" fill="#2563eb"/>
    <circle cx="250" cy="245" r="4" fill="#111827"/>
    <circle cx="250" cy="380" r="4" fill="#dc2626"/>
    <circle cx="250" cy="415" r="4" fill="#2563eb"/>
    <circle cx="250" cy="450" r="4" fill="#2563eb"/>
    <circle cx="250" cy="485" r="4" fill="#111827"/>
    <circle cx="700" cy="140" r="4" fill="#dc2626"/>
    <circle cx="700" cy="175" r="4" fill="#2563eb"/>
    <circle cx="700" cy="210" r="4" fill="#2563eb"/>
    <circle cx="700" cy="245" r="4" fill="#111827"/>
    <circle cx="700" cy="380" r="4" fill="#dc2626"/>
    <circle cx="700" cy="415" r="4" fill="#2563eb"/>
    <circle cx="700" cy="450" r="4" fill="#2563eb"/>
    <circle cx="700" cy="485" r="4" fill="#111827"/>
    <!-- 分支点（大点 = 电气相连） -->
    <circle cx="560" cy="245" r="5" fill="#111827"/>
  </g>

  <!-- ============ 图例与注意事项 ============ -->
  <g font-size="13" fill="#374151">
    <path d="M40 600 H92" stroke="#dc2626" stroke-width="3"/>
    <text x="100" y="605">电源（5V / 3V3）</text>
    <path d="M260 600 H312" stroke="#111827" stroke-width="3"/>
    <text x="320" y="605">GND</text>
    <path d="M400 600 H452" stroke="#2563eb" stroke-width="3"/>
    <text x="460" y="605">信号线（GPIO → 模块）</text>
  </g>
  <g font-size="13" fill="#374151">
    <text x="40" y="638">① MQ-2 必须用 5V 供电（别用板载 3V3：加热不足、读数整体偏低）；它的 DO/AO 都能到 5V，各串 1kΩ + 对地 2kΩ 分压后再进 GPIO</text>
    <text x="40" y="662">② 火焰模块用 3.3V 供电，DO/AO 直连 GPIO，不需要电阻；若改成 5V 供电则同样必须分压</text>
    <text x="40" y="686">③ 模拟量只能接 ADC1（GPIO1~GPIO10）：S3 的 ADC2 在 WiFi 打开时不可用，而本节点全程跑 ESP-NOW（射频常开）</text>
    <text x="40" y="710">④ 蓝色电位器调 DO 触发阈值；MQ-2 上电需预热约 3 分钟（GAS_WARMUP_MS）；模块引脚排列以丝印为准，线交叉处不连接</text>
    <text x="40" y="734">⑤ 本节点只监测、只播报，不控制燃气阀门/排风扇；演示固件不能当生命安全设备使用</text>
  </g>
</svg>
