<?xml version="1.0" encoding="UTF-8"?>
<!-- 节点 1「客厅灯」接线图：ESP32-S3 + RGB 模块（4 线共阳）+ HC-SR04（宽电压 3.3–5V，3.3V 供电）
     与 EspNowNode.ino（NODE_ID=1）的引脚定义一一对应。
     超声波用 3.3V 供电 → ECHO 输出也是 ~3.3V，可直连 GPIO15，无需分压。
     （若改用 5V 供电：ECHO 必须先分压，见下方图注②）
     RGB 是 4 线共阳模块：+（公共阳极）/ R / G / B，没有独立 GND 脚。
     画法：线与线交叉处用白底"跳线"断开，表示不相连；模块引脚物理排列以实物丝印为准。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" width="1000" height="830"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <rect x="0" y="0" width="1000" height="830" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold" fill="#111827">节点 1「客厅灯」接线：ESP32-S3 + RGB 模块（4 线共阳）+ HC-SR04 超声波</text>

  <!-- ============ 连线：每条线先画白色粗底再画彩线，
       后画的线会在交叉处形成"跳线"缺口（表示不相连） ============ -->

  <!-- 信号线（蓝）：GPIO4/5/6 -> R/G/B，GPIO7 -> TRIG，GPIO15 -> ECHO -->
  <g fill="none">
    <path d="M250 270 H620" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 270 H620" stroke="#2563eb" stroke-width="3"/>
    <path d="M250 305 H620" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 305 H620" stroke="#2563eb" stroke-width="3"/>
    <path d="M250 340 H620" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 340 H620" stroke="#2563eb" stroke-width="3"/>
    <path d="M250 525 H620" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 525 H620" stroke="#2563eb" stroke-width="3"/>
    <path d="M250 560 H620" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 560 H620" stroke="#2563eb" stroke-width="3"/>
  </g>

  <!-- 地线（黑）：GND -> 超声波 GND（RGB 模块没有 GND 脚） -->
  <g fill="none">
    <path d="M250 205 H560 V595 H620" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 205 H560 V595 H620" stroke="#111827" stroke-width="3"/>
  </g>

  <!-- 3V3（红）：3V3 -> RGB 公共阳极（+），并从 3V3 引出到超声波 VCC -->
  <g fill="none">
    <path d="M250 170 H620" stroke="#ffffff" stroke-width="8"/>
    <path d="M250 170 H620" stroke="#dc2626" stroke-width="3"/>
    <path d="M520 170 V490 H620" stroke="#ffffff" stroke-width="8"/>
    <path d="M520 170 V490 H620" stroke="#dc2626" stroke-width="3"/>
  </g>

  <!-- ============ 模块方框 ============ -->
  <!-- ESP32-S3 -->
  <rect x="40" y="90" width="210" height="510" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="145" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">ESP32-S3</text>
  <text x="145" y="146" text-anchor="middle" font-size="12" fill="#6b7280">（USB 5V 供电）</text>

  <!-- RGB 模块 -->
  <rect x="620" y="90" width="340" height="300" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="790" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#78350f">RGB 模块（4 线，共阳）</text>
  <text x="790" y="146" text-anchor="middle" font-size="12" fill="#92400e">丝印为 + / R / G / B，没有独立 GND 脚</text>
  <text x="790" y="370" text-anchor="middle" font-size="12" fill="#92400e">+ 是公共阳极：接 3V3，低电平点亮</text>

  <!-- 超声波模块 -->
  <rect x="620" y="430" width="340" height="230" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="790" y="458" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">HC-SR04（宽电压 3.3–5V）</text>
  <text x="790" y="646" text-anchor="middle" font-size="12" fill="#1e40af">本图用 3.3V 供电 → ECHO ≈ 3.3V，可直连 GPIO15</text>

  <!-- ============ 引脚名 + 连接点 ============ -->
  <g font-size="14" fill="#111827">
    <text x="232" y="175" text-anchor="end">3V3</text>
    <text x="232" y="210" text-anchor="end">GND</text>
    <text x="232" y="275" text-anchor="end">GPIO4</text>
    <text x="232" y="310" text-anchor="end">GPIO5</text>
    <text x="232" y="345" text-anchor="end">GPIO6</text>
    <text x="232" y="530" text-anchor="end">GPIO7</text>
    <text x="232" y="565" text-anchor="end">GPIO15</text>
  </g>
  <g font-size="14" fill="#111827">
    <text x="640" y="175">+（公共阳极）</text>
    <text x="640" y="275">R</text>
    <text x="640" y="310">G</text>
    <text x="640" y="345">B</text>
  </g>
  <g font-size="14" fill="#111827">
    <text x="640" y="495">VCC</text>
    <text x="640" y="530">TRIG</text>
    <text x="640" y="565">ECHO</text>
    <text x="640" y="600">GND</text>
  </g>

  <!-- 连接点（圆点） -->
  <g>
    <circle cx="250" cy="170" r="4" fill="#dc2626"/>
    <circle cx="250" cy="205" r="4" fill="#111827"/>
    <circle cx="250" cy="270" r="4" fill="#2563eb"/>
    <circle cx="250" cy="305" r="4" fill="#2563eb"/>
    <circle cx="250" cy="340" r="4" fill="#2563eb"/>
    <circle cx="250" cy="525" r="4" fill="#2563eb"/>
    <circle cx="250" cy="560" r="4" fill="#2563eb"/>
    <circle cx="620" cy="170" r="4" fill="#dc2626"/>
    <circle cx="620" cy="270" r="4" fill="#2563eb"/>
    <circle cx="620" cy="305" r="4" fill="#2563eb"/>
    <circle cx="620" cy="340" r="4" fill="#2563eb"/>
    <circle cx="620" cy="490" r="4" fill="#dc2626"/>
    <circle cx="620" cy="525" r="4" fill="#2563eb"/>
    <circle cx="620" cy="560" r="4" fill="#2563eb"/>
    <circle cx="620" cy="595" r="4" fill="#111827"/>
    <!-- 分支点：3V3 引出到超声波 VCC（实心大点 = 电气相连） -->
    <circle cx="520" cy="170" r="5" fill="#dc2626"/>
  </g>

  <!-- ============ 图例与注意事项 ============ -->
  <g font-size="13" fill="#374151">
    <path d="M40 700 H92" stroke="#dc2626" stroke-width="3"/>
    <text x="100" y="705">3V3 电源</text>
    <path d="M200 700 H252" stroke="#111827" stroke-width="3"/>
    <text x="260" y="705">GND</text>
    <path d="M330 700 H382" stroke="#2563eb" stroke-width="3"/>
    <text x="390" y="705">信号线（GPIO → 模块）</text>
  </g>
  <g font-size="13" fill="#374151">
    <text x="40" y="738">① 超声波用 3.3V 供电：VCC 接 3V3，ECHO 直连 GPIO15（宽电压模块 3.3V 供电时 ECHO 输出 ≈ 3.3V，无需分压）</text>
    <text x="40" y="760">② 若改用 5V 供电（或模块是 5V-only 版）：ECHO 必须先串 1kΩ 并对地接 2kΩ 分压到 ~3.3V 再接 GPIO15，否则 5V 会损伤芯片</text>
    <text x="40" y="782">③ TRIG 用 3.3V 多数模块能触发；若串口一直报 no echo (timeout)，先查接线，再考虑给 TRIG 加电平转换</text>
    <text x="40" y="804">④ RGB 为 4 线共阳（+ / R / G / B）：+ 接 3V3；共阴模块公共端改接 GND 并把 RGB_COMMON_ANODE 改成 0。引脚排列以丝印为准，线交叉处不连接</text>
  </g>
</svg>
